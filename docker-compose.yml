services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow} -d ${POSTGRES_DB:-tradeflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeflow-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tradeflow:tradeflow@postgres:5432/tradeflow}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-tradeflow-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ENABLE_YFINANCE: ${ENABLE_YFINANCE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      WISPR_API_KEY: ${WISPR_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradeflow-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
